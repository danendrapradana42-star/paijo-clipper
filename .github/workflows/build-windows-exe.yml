name: Build & Publish Windows EXE (Paijo Clip)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag rilis opsional (contoh: v1.5.0). Kosongkan untuk memakai versi dari package.json."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve version tag
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $tag = "v$ver"
            }
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows Setup Installer & Portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify generated Windows EXE binaries
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path release -Filter "*.exe" -File | Where-Object { $_.Length -gt 20MB }
          if (-not $exes -or $exes.Count -eq 0) {
            Write-Error "No valid Windows .exe binaries (>20MB) were generated in release/."
            exit 1
          }
          $exes | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Windows EXE Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Paijo-Clip-Windows-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Setup & Portable EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Paijo Clip ${{ steps.meta.outputs.tag }} (Windows x64)
          generate_release_notes: true
          make_latest: true
          files: release/*.exe
          fail_on_unmatched_files: true
